name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - "cloudfunctions/**"
      - "packages/shared/**"
      - "scripts/**"
      - ".github/workflows/deploy-cloud.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
      TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
      ENV_ID: ${{ vars.ENV_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build cloud functions
        run: npm run build:cloud

      - name: Install CloudBase CLI
        run: npm i -g @cloudbase/cli@3

      - name: Login
        run: tcb login --apiKeyId "$TENCENT_SECRET_ID" --apiKey "$TENCENT_SECRET_KEY"

      - name: Deploy functions
        run: |
          set -euo pipefail
          for fn in auth rebate notify withdraw payment daily-task reconcile export; do
            echo "::group::deploy $fn"
            tcb fn deploy "$fn" --force --dir "cloudfunctions/$fn" -e "$ENV_ID"
            echo "::endgroup::"
          done
